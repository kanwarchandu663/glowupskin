<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Contact - Natural Glow Up</title>
  <link rel="stylesheet" href="style.css">

<body>

<header>
  <h1>🍓 Natural Glow Up</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="page">
  <h2>Contact Us</h2>

  <p>Want to order our products? Send us your details.</p>

  <form onsubmit="sendMessage(event)">
    <input type="text" id="name" placeholder="Your Name" required>

    <input type="email" id="email" placeholder="Your Email" required>

    <input type="text" id="product" placeholder="Product Name" required>

    <textarea id="message" placeholder="Your Message" required></textarea>

    <button type="submit">Send Message</button>
  </form>

  <div class="contact-info">
    <h3>Business Owners</h3>
    <p>Radhika Naruka & Deepika Jangid</p>
  </div>
</section>

<footer>
  <p>© 2026 Natural Glow Up</p>
</footer>

<script src="script.js"></script>
</body>
</html>
